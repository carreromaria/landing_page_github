<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LINENCE | Prototipo Hero v4</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Dancing+Script:wght@500;700&display=swap" rel="stylesheet">
<link href="https://fonts.cdnfonts.com/css/champagne-limousines" rel="stylesheet">

<style>
  :root{
    --ink:#141213;
    --gold:#d6a52c;
    --sand:#d3bb8c;
    --cream:#faf7f2;
    --gold-line:rgba(214,165,44,0.5);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Poppins', sans-serif;
    background:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  h1{
    font-family:'Champagne & Limousines','Poppins', serif;
    font-weight:700;
    letter-spacing:0.01em;
    color:var(--cream);
  }
  a{color:inherit; text-decoration:none;}

  .topbar{
    position:absolute; top:0; left:0; right:0; z-index:5;
    padding:26px clamp(24px, 6vw, 90px);
    display:flex; align-items:center; justify-content:space-between;
  }
  .logo{
    font-family:'Champagne & Limousines','Poppins', serif;
    color:var(--cream); font-size:22px; letter-spacing:0.14em; font-weight:700;
  }
  .logo span{color:var(--gold);}
  .logo small{display:block; font-family:'Poppins',sans-serif; font-size:8.5px; letter-spacing:0.35em; color:var(--sand); font-weight:400; margin-top:2px;}
  .note-pill{
    color:var(--sand); font-size:11px; letter-spacing:0.08em; text-transform:uppercase;
    border:1px solid var(--gold-line); padding:7px 14px; border-radius:20px;
    background:rgba(20,18,19,0.35); backdrop-filter:blur(4px);
  }

  /* ---------- Hero a pantalla completa ---------- */
  .hero{
    position:relative;
    min-height:100vh;
    display:flex;
    align-items:center;
    overflow:hidden;
    background:#1a1614;
    color:var(--cream);
  }

  .hero-reel{ position:absolute; inset:0; z-index:1; }
  .reel-slide{
    position:absolute; inset:0;
    opacity:0;                 /* estado base: nunca se amontonan mientras esperan turno */
    animation:reel-cycle 12s infinite;
  }
  .reel-slide img{
    position:absolute; inset:0;
    width:100%; height:100%; object-fit:cover;
    transform:scale(1.0);
    animation:reel-zoom 4s infinite ease-out;
  }
  .reel-slide:nth-child(1){ animation-delay:0s; }
  .reel-slide:nth-child(1) img{ animation-delay:0s; }
  .reel-slide:nth-child(2){ animation-delay:4s; }
  .reel-slide:nth-child(2) img{ animation-delay:4s; }
  .reel-slide:nth-child(3){ animation-delay:8s; }
  .reel-slide:nth-child(3) img{ animation-delay:8s; }

  @keyframes reel-cycle{
    0%{opacity:0;}
    2%{opacity:1;}
    31%{opacity:1;}
    33.3%{opacity:0;}
    100%{opacity:0;}
  }
  @keyframes reel-zoom{
    0%{transform:scale(1.0);}
    100%{transform:scale(1.08);}
  }

  .hero-reel::after{
    content:'';
    position:absolute; inset:0; z-index:2;
    box-shadow:inset 0 0 140px rgba(20,18,19,0.5);
    pointer-events:none;
  }

  /* Difuminado + oscurecido SOLO detrás del texto (columna izquierda) */
  .hero-scrim{
    position:absolute; inset:0; z-index:2;
    background:linear-gradient(90deg,
      rgba(20,18,19,0.90) 0%,
      rgba(20,18,19,0.86) 34%,
      rgba(20,18,19,0.55) 46%,
      rgba(20,18,19,0.15) 56%,
      rgba(20,18,19,0) 64%);
    backdrop-filter:blur(7px);
    -webkit-mask-image:linear-gradient(90deg, #000 0%, #000 40%, transparent 62%);
    mask-image:linear-gradient(90deg, #000 0%, #000 40%, transparent 62%);
    pointer-events:none;
  }

  .hero-content{
    position:relative; z-index:3;
    padding-left:clamp(24px, 6vw, 90px);
    padding-right:24px;
    max-width:540px;
  }
  .hero h1{
    font-size:clamp(34px, 4.6vw, 62px);
    line-height:1.08;
    margin-bottom:24px;
    text-shadow:0 2px 18px rgba(0,0,0,0.4);
  }
  .hero h1 em{ font-style:normal; color:var(--gold); }
  .hero p.lead{
    max-width:460px; font-size:16.5px; color:rgba(250,247,242,0.85);
    margin-bottom:40px; font-weight:300;
  }
  .hero-actions{display:flex; gap:18px; flex-wrap:wrap;}
  .btn-primary{
    background:var(--gold); color:var(--ink); padding:16px 34px; font-size:13px;
    letter-spacing:0.08em; text-transform:uppercase; font-weight:500; border-radius:2px;
    display:inline-block;
  }
  .btn-outline{
    border:1px solid rgba(250,247,242,0.55); color:var(--cream); padding:16px 34px;
    font-size:13px; letter-spacing:0.08em; text-transform:uppercase; border-radius:2px;
    backdrop-filter:blur(2px);
  }

  /* ---------- Texto gancho: aparición en cascada, letra por letra ---------- */
  .hero-hook{
    position:absolute;
    right:clamp(24px, 6vw, 90px); bottom:9%;
    z-index:3;
    max-width:420px;
    text-align:right;
  }
  .hook-line{
    display:block;
    font-family:'Dancing Script', cursive;
    font-weight:600;
    font-size:clamp(24px, 2.8vw, 38px);
    color:var(--sand);
  }
  .ch{
    display:inline-block;
    opacity:0;
    transform:translateY(5px);
    animation:ch-cycle 12s infinite;
    text-shadow:0 2px 12px rgba(0,0,0,0.5);
  }
  @keyframes ch-cycle{
    0%{ opacity:0; transform:translateY(5px); }
    4%{ opacity:1; transform:translateY(0); }
    86%{ opacity:1; transform:translateY(0); }
    95%{ opacity:0; transform:translateY(-3px); }
    100%{ opacity:0; transform:translateY(5px); }
  }

  /* ---------- Barra de progreso, muy discreta ---------- */
  .reel-progress{
    position:absolute; left:0; right:0; bottom:0; z-index:4;
    display:flex; gap:2px; padding:0 2px 2px;
  }
  .reel-progress i{
    flex:1; height:2px; background:rgba(250,247,242,0.18); position:relative; overflow:hidden;
  }
  .reel-progress i::after{
    content:''; position:absolute; inset:0; background:var(--gold);
    transform:scaleX(0); transform-origin:left; animation:bar-fill 12s infinite;
  }
  .reel-progress i:nth-child(1)::after{ animation-delay:0s; }
  .reel-progress i:nth-child(2)::after{ animation-delay:4s; }
  .reel-progress i:nth-child(3)::after{ animation-delay:8s; }
  @keyframes bar-fill{
    0%{transform:scaleX(0);}
    33%{transform:scaleX(1);}
    100%{transform:scaleX(1);}
  }

  @media(max-width:860px){
    .hero{ align-items:flex-end; padding-bottom:60px; }
    .hero-content{ max-width:100%; padding-right:24px; }
    .hero-scrim{
      background:linear-gradient(0deg, rgba(20,18,19,0.92) 0%, rgba(20,18,19,0.8) 42%, rgba(20,18,19,0.2) 72%, rgba(20,18,19,0) 100%);
      -webkit-mask-image:linear-gradient(0deg, #000 0%, #000 46%, transparent 78%);
      mask-image:linear-gradient(0deg, #000 0%, #000 46%, transparent 78%);
    }
    .hero-hook{ display:none; }
  }

  @media (prefers-reduced-motion: reduce){
    .reel-slide, .reel-slide img, .reel-progress i::after, .ch{ animation:none !important; }
    .reel-slide{ opacity:0; }
    .reel-slide:first-child{ opacity:1; }
    .ch{ opacity:1; transform:none; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">LIN<span>ENCE</span><small>LÍNEA &amp; ESENCIA</small></div>
  <div class="note-pill">Prototipo v4 — no publicado</div>
</div>

<section class="hero" id="inicio">

  <div class="hero-reel">
    <div class="reel-slide"><img src="https://images.unsplash.com/photo-1682662045815-9016c6225dd3?w=1400&q=80&auto=format&fit=crop" alt="Cocina moderna a medida"></div>
    <div class="reel-slide"><img src="https://images.unsplash.com/photo-1721742736286-a5eaeb4e5263?w=1400&q=80&auto=format&fit=crop" alt="Walk-in closet de lujo con lámpara colgante e isla central"></div>
    <div class="reel-slide"><img src="https://images.unsplash.com/photo-1595428774991-829cfeea6267?w=1400&q=80&auto=format&fit=crop" alt="Vanitorio con mueble de cajones"></div>
  </div>

  <div class="hero-scrim"></div>

  <div class="hero-content">
    <h1>Mobiliario que se mide<br> a la <em>exactitud</em> de tu espacio.</h1>
    <p class="lead">Diseñamos y fabricamos mobiliario a medida para proyectos residenciales y comerciales de alto estándar: cocinas, closets, mobiliario corporativo y más.</p>
    <div class="hero-actions">
      <a href="#" class="btn-primary">Solicitar Cotización</a>
      <a href="#" class="btn-outline">Ver Portafolio</a>
    </div>
  </div>

  <div class="hero-hook">
    <span class="hook-line" data-text="Hecho a tu medida,"></span>
    <span class="hook-line" data-text="hecho para durar."></span>
  </div>

  <div class="reel-progress"><i></i><i></i><i></i></div>
</section>

<script>
  // Envuelve cada letra en su propio <span> con un retraso creciente,
  // para que el texto se vea "escribiéndose" en cascada, letra por letra.
  (function(){
    var lines = document.querySelectorAll('.hook-line');
    var globalIndex = 0;
    var STEP = 0.14; // segundos entre letra y letra
    lines.forEach(function(line){
      var text = line.getAttribute('data-text') || '';
      for (var i = 0; i < text.length; i++){
        var ch = text[i];
        var span = document.createElement('span');
        span.className = 'ch';
        span.textContent = (ch === ' ') ? '\u00A0' : ch;
        span.style.animationDelay = (globalIndex * STEP) + 's';
        line.appendChild(span);
        globalIndex++;
      }
    });
  })();
</script>

</body>
</html>
