<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso Staff · LINENCE</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="shortcut icon" type="image/png" href="../favicon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body>

<div class="login-wrap">
  <form class="login-card" id="loginForm" novalidate>
    <img src="assets/img/logo-wordmark-claro.png" alt="Linence">
    <h1>Panel Interno</h1>
    <p class="subtitulo">Acceso exclusivo para el equipo Linence</p>

    <div class="login-field">
      <label for="email">Correo electrónico</label>
      <input type="email" id="email" name="email" placeholder="tucorreo@linence.cl" autocomplete="username" required>
    </div>

    <div class="login-field">
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
    </div>

    <button type="submit" class="login-btn" id="loginBtn">Ingresar</button>

    <div class="login-error" id="loginError"></div>

    <a href="https://linence.cl" class="login-footer-link">← Volver al sitio de Linence</a>
  </form>
</div>

<script type="module" src="js/login-page.js"></script>
</body>
</html>
